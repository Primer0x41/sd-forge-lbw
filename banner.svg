<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img" aria-label="SD Forge LBW - Per-block LoRA weight control for Forge Neo">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#172542"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer container -->
  <rect x="2" y="2" width="856" height="216" rx="14" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="2" y="2" width="856" height="216" rx="14" fill="url(#grid)" opacity="0.55"/>

  <!-- Top accent bar within safe margin -->
  <rect x="44" y="28" width="160" height="4" rx="2" fill="url(#accent-line)"/>

  <!-- Left typography block (safe x >= 44, y in 48..184) -->
  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8" fill="#38bdf8">
    FORGE NEO EXTENSION
  </text>

  <text x="44" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">
    SD Forge LBW
  </text>

  <text x="44" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">
    Per-block LoRA weight control &amp; live prompt popover
  </text>

  <!-- Architecture pill strip -->
  <rect x="44" y="156" width="474" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="58" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#93c5fd">
    SD/XL · Flux · Anima · Wan 2.1 · Qwen · MOSS
  </text>

  <!-- Right block-weight equalizer panel (x: 556..816, y: 34..186) -->
  <rect x="556" y="34" width="260" height="152" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="574" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">
    BLOCK WEIGHTS
  </text>
  <text x="798" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">
    lbw=FACE
  </text>

  <!-- Track lines -->
  <line x1="584" y1="74" x2="584" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="614" y1="74" x2="614" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="644" y1="74" x2="644" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="674" y1="74" x2="674" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="704" y1="74" x2="704" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="734" y1="74" x2="734" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="764" y1="74" x2="764" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="794" y1="74" x2="794" y2="152" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Active slider fills + thumbs -->
  <!-- Composition (blue) -->
  <line x1="584" y1="126" x2="584" y2="152" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="584" cy="126" r="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="614" y1="112" x2="614" y2="152" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="614" cy="112" r="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Face / Mid (emerald) -->
  <line x1="644" y1="84" x2="644" y2="152" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="644" cy="84" r="6" fill="#f8fafc" stroke="#10b981" stroke-width="2.5"/>
  <line x1="674" y1="76" x2="674" y2="152" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="674" cy="76" r="6" fill="#f8fafc" stroke="#10b981" stroke-width="2.5"/>
  <line x1="704" y1="90" x2="704" y2="152" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="704" cy="90" r="6" fill="#f8fafc" stroke="#10b981" stroke-width="2.5"/>

  <!-- Style (violet) -->
  <line x1="734" y1="118" x2="734" y2="152" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="734" cy="118" r="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2.5"/>
  <line x1="764" y1="132" x2="764" y2="152" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="764" cy="132" r="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- Texture (pink) -->
  <line x1="794" y1="140" x2="794" y2="152" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <circle cx="794" cy="140" r="6" fill="#f8fafc" stroke="#ec4899" stroke-width="2.5"/>

  <!-- Bottom labels -->
  <text x="599" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8">IN</text>
  <text x="674" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#10b981">MID</text>
  <text x="749" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8">OUT</text>
  <text x="794" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8">TX</text>
</svg>
